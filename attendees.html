<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width-device-width, initial-scale=1.0">

  <title>College Career Conference - Attendee Registration</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- CSS Styling -->
  <link rel="stylesheet" href="signup.css">
</head>

<body>
  <div class="container my-5">
    <div class="registration-container">
      <h1 class="text-center">College Career Conference</h1>
      <h2 class="text-center">Attendee Registration</h2>

      <form id="registrationForm" novalidate> 

        <!-- Full Name -->
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name *</label>
          <input
            type="text"
            class="form-control"
            id="fullName"
            placeholder="Enter your full name"
            required>
          <div class="invalid-feedback">Please enter your full name.</div>
        </div>
  
        <!--Age -->
        <div class="mb-3">
          <label for="age" class="form-label">Age *</label>
          <input type="number" class="form-control" id="age" placeholder="Enter your age"
            min="16" max="100" required>
          <div class="invalid-feedback">Please enter a valid age.</div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" class="form-control" id="email" placeholder="name@example.com"
            required>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <!-- Phone -->
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="phone" placeholder="555-555-5555">
          <div class="invalid-feedback">Please enter a valid phone number.</div>
        </div>

        <!-- Address -->
        <div class="mb-4">
          <label for="address" class="form-label">Address *</label>
          <input type="text" class="form-control" id="address" placeholder="Enter your address" required>
          <div class="invalid-feedback">Please enter your address.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="submitButton">Register for Conference</button>

      </form>

      <div id="successMessage" class="alert alert-success mt-3 d-none">Attendee registered successfully!</div>
    </div>

    <!-- Registered Attendees -->
    <div class="attendee-container mt-5">

      <h2 class="text-center mb-4">Registered Attendees</h2>

      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Address</th>
              <th>Update</th>
            </tr>
          </thead>

          <tbody id="attendeeTable">
            <!-- JavaScript adds Attendees here -->
          </tbody>

        </table>

      </div>

    </div>

  </div>

  <script src="signup.js"></script>

</body>
</html>
            </tr>


        
        
</body>
